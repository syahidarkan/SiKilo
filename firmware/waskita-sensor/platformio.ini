; WASKITA - firmware kotak sensor energi (ESP32 DevKit)
;
;   pio run -e esp32dev                 # kompilasi
;   pio run -e esp32dev -t upload       # flash via USB
;   pio device monitor -e esp32dev      # serial 115200 (ketik 'help')
;   pio test -e native                  # uji unit perhitungan daya di PC (butuh gcc/g++)
;   WASKITA_OTA_PASSWORD=... pio run -e esp32dev_ota -t upload --upload-port waskita-xxxxxx.local

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -DWASKITA_FW_VERSION=\"0.1.0\"

[env:esp32dev]
; espressif32 6.x = Arduino-ESP32 2.0.x (ESP-IDF 4.4). Versi dikunci agar build reprodusibel.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions_waskita.csv
board_build.filesystem = littlefs
lib_deps =
    tzapu/WiFiManager@2.0.17
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -Wall

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
    --auth=${sysenv.WASKITA_OTA_PASSWORD}

[env:native]
; Uji unit lib/waskita_core (tanpa Arduino). Windows: pasang MinGW-w64/MSYS2 gcc.
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -lm
